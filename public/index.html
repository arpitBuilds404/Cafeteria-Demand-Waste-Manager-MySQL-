<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafeteria Demand & Waste Manager</title>

    <style>
        :root {
            --bg: #f3f5f2;
            --sf: #ffffff;
            --tx: #17211b;
            --mu: #5b6a60;
            --ln: #d9e0da;
            --gr: #1f7a4d;
            --rd: #c8452f;
            --ac: #123d2b;
        }

        @media(prefers-color-scheme:dark) {
            :root {
                --bg: #101613;
                --sf: #18211c;
                --tx: #e8efe9;
                --mu: #9bab9f;
                --ln: #2b382f;
                --gr: #5cc48a;
                --rd: #ef7b64;
                --ac: #5cc48a;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--tx);
            font: 15px/1.5 system-ui, sans-serif;
        }

        header {
            background: var(--ac);
            color: var(--bg);
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        h1 {
            margin: 0;
            font-size: 20px;
        }

        nav {
            display: flex;
            gap: 4px;
            padding: 10px 20px 0;
            border-bottom: 1px solid var(--ln);
            overflow-x: auto;
        }

        nav button {
            background: none;
            border: 0;
            border-bottom: 3px solid transparent;
            color: var(--mu);
            padding: 8px 12px;
            font: inherit;
            cursor: pointer;
            white-space: nowrap;
        }

        nav button.on {
            color: var(--tx);
            border-color: var(--gr);
        }

        main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            gap: 14px;
        }

        .box {
            background: var(--sf);
            border: 1px solid var(--ln);
            border-radius: 8px;
            padding: 14px;
            overflow-x: auto;
        }

        h2 {
            font-size: 17px;
            margin: 0 0 10px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 14px;
        }

        th,
        td {
            text-align: left;
            padding: 6px 8px;
            border-bottom: 1px solid var(--ln);
            white-space: nowrap;
        }

        th {
            color: var(--mu);
        }

        form {
            display: grid;
            gap: 8px;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            align-items: end;
        }

        label {
            display: grid;
            gap: 3px;
            font-size: 13px;
            color: var(--mu);
        }

        select,
        input,
        button.go {
            font: inherit;
            padding: 7px 9px;
            border: 1px solid var(--ln);
            border-radius: 6px;
            background: var(--sf);
            color: var(--tx);
        }

        header select {
            min-width: 150px;
        }

        button.go {
            background: var(--ac);
            color: white;
            border-color: var(--ac);
            font-weight: 600;
            cursor: pointer;
        }

        .ok {
            color: var(--gr);
        }

        .er {
            color: var(--rd);
        }

        .note {
            color: var(--mu);
            font-size: 13px;
        }

        @media(max-width:600px) {
            header {
                align-items: flex-start;
            }

            main {
                padding: 12px;
            }

            nav {
                padding-left: 10px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Cafeteria Demand & Waste Manager (MySQL)</h1>

        <label>
            Select Role
            <select id="role">
                <option value="manager">Manager</option>
                <option value="staff">Cafeteria Staff</option>
            </select>
        </label>
    </header>

    <nav id="nav"></nav>

    <main id="app"></main>

    <script>

        // ========================================
        // API CONFIGURATION
        // ========================================

        const $ = s => document.querySelector(s);

        const api = async (u, b) => {
            const r = await fetch(
                "/api/" + u,
                b ? {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(b)
                } : {}
            );

            const j = await r.json();

            if (!r.ok) {
                throw new Error(j.error || "Something went wrong");
            }

            return j;
        };


        // ========================================
        // HELPER FUNCTIONS
        // ========================================

        const esc = s =>
            String(s ?? "").replace(/[&<>"]/g, c => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;"
            }[c]));

        const tbl = rows =>
            rows.length
                ? `<table>
        <tr>
          ${Object.keys(rows[0])
                    .map(k => `<th>${esc(k)}</th>`).join("")}
        </tr>

        ${rows.map(r => `
          <tr>
            ${Object.values(r)
                            .map(v => `<td>${esc(v)}</td>`).join("")}
          </tr>
        `).join("")}
      </table>`
                : "<p>No rows available.</p>";

        const opts = (a, v, t) =>
            a.map(x =>
                `<option value="${esc(x[v])}">${esc(x[t])}</option>`
            ).join("");

        const box = (t, h) =>
            `<div class="box"><h2>${t}</h2>${h}</div>`;

        const msg = '<div id="m" role="status"></div>';

        const say = (ok, t) => {
            const message = $("#m");

            if (message) {
                message.innerHTML =
                    `<span class="${ok ? "ok" : "er"}">${esc(t)}</span>`;
            }
        };


        // ========================================
        // ROLE-BASED ACCESS CONTROL
        // ========================================

        let role = "manager";
        let tab = "Dashboard";

        const permissions = {
            Dashboard: ["manager", "staff"],
            Prepare: ["manager", "staff"],
            Purchase: ["manager"],
            Waste: ["manager", "staff"],
            Analytics: ["manager"],
            Audit: ["manager"]
        };

        function hasAccess(page) {
            return permissions[page]?.includes(role) || false;
        }


        // ========================================
        // FORM HANDLING
        // ========================================

        function form(fields, btn) {
            return `
    <form id="f">
      ${fields}
      <button class="go">${btn}</button>
    </form>
    ${msg}
  `;
        }

        function bind(url, get, tabName) {

            const f = $("#f");

            if (!f) return;

            f.onsubmit = async e => {
                e.preventDefault();

                try {
                    const r = await api(url, get());

                    await show(tabName);

                    say(true, r.message || "Operation completed successfully");

                } catch (err) {
                    say(false, err.message);
                }
            };
        }


        // ========================================
        // DASHBOARD
        // ========================================

        const tabs = {

            async Dashboard() {

                const d = await api("dashboard");

                return (
                    box("Low Stock", tbl(d.low)) +
                    box("Today's Preparation", tbl(d.today)) +
                    box("Daily KPI (v_daily_kpi)", tbl(d.kpi))
                );
            },


            // ========================================
            // PREPARE FOOD
            // ========================================

            async Prepare() {

                const x = await api("dishes");

                setTimeout(() => {

                    bind(
                        "prepare",

                        () => ({
                            dish: $("#d").value,
                            qty: $("#q").value,
                            fail: $("#x").value == "1"
                        }),

                        "Prepare"
                    );

                }, 0);

                return box(
                    "Record Food Preparation",

                    form(`
        <label>
          Dish
          <select id="d">
            ${opts(x, "dish_id", "dish_name")}
          </select>
        </label>

        <label>
          Portions
          <input
            id="q"
            type="number"
            min="1"
            value="40"
            required
          >
        </label>

        <label>
          Simulate Failure After Savepoint
          <select id="x">
            <option value="0">No</option>
            <option value="1">Yes</option>
          </select>
        </label>

      `, "Prepare")
                );
            },


            // ========================================
            // PURCHASE INGREDIENTS
            // MANAGER ONLY
            // ========================================

            async Purchase() {

                const [i, s] = await Promise.all([
                    api("ingredients"),
                    api("suppliers")
                ]);

                setTimeout(() => {

                    bind(
                        "purchase",

                        () => ({
                            ingredient: $("#i").value,
                            supplier: $("#s").value,
                            qty: $("#q").value
                        }),

                        "Purchase"
                    );

                }, 0);

                return (
                    box(
                        "Record Purchase",

                        form(`
          <label>
            Ingredient
            <select id="i">
              ${opts(i, "ingredient_id", "ingredient_name")}
            </select>
          </label>

          <label>
            Supplier
            <select id="s">
              ${opts(s, "supplier_id", "supplier_name")}
            </select>
          </label>

          <label>
            Quantity
            <input
              id="q"
              type="number"
              min="1"
              value="20"
              required
            >
          </label>

        `, "Add Purchase")
                    ) +

                    box("Current Stock", tbl(i))
                );
            },


            // ========================================
            // WASTE MANAGEMENT
            // ========================================

            async Waste() {

                const x = await api("dishes");

                setTimeout(() => {

                    bind(
                        "usage",

                        () => ({
                            dish: $("#d").value,
                            cons: $("#c").value,
                            waste: $("#w").value,
                            reason: $("#r").value
                        }),

                        "Waste"
                    );

                }, 0);

                return box(
                    "Record Consumption and Waste",

                    form(`
        <label>
          Dish
          <select id="d">
            ${opts(x, "dish_id", "dish_name")}
          </select>
        </label>

        <label>
          Consumed
          <input
            id="c"
            type="number"
            min="0"
            value="0"
            required
          >
        </label>

        <label>
          Wasted
          <input
            id="w"
            type="number"
            min="0"
            value="0"
            required
          >
        </label>

        <label>
          Reason
          <select id="r">
            <option>Over-preparation</option>
            <option>Left on plates</option>
            <option>Spoilage</option>
          </select>
        </label>

      `, "Save")
                );
            },


            // ========================================
            // ANALYTICS
            // MANAGER ONLY
            // ========================================

            async Analytics() {

                const a = await api("analytics");

                return (
                    box(
                        "Dishes Ranked by Average Waste (RANK)",
                        tbl(a.ranking)
                    ) +

                    box(
                        "Weekly Demand (CTE)",
                        tbl(a.weekly)
                    )
                );
            },


            // ========================================
            // AUDIT LOG
            // MANAGER ONLY
            // ========================================

            async Audit() {

                return box(
                    "Audit Log (Trigger Generated)",
                    tbl(await api("audit"))
                );
            }

        };


        // ========================================
        // DISPLAY AND NAVIGATION
        // ========================================

        async function show(t) {

            if (t) {
                tab = t;
            }

            // Check role permissions
            if (!hasAccess(tab)) {
                tab = "Dashboard";
            }

            // Display only permitted tabs
            $("#nav").innerHTML = Object.keys(tabs)

                .filter(k => hasAccess(k))

                .map(k => `
      <button
        data-t="${k}"
        class="${k == tab ? "on" : ""}"
      >
        ${k}
      </button>
    `).join("");


            // Load selected page
            try {

                $("#app").innerHTML = await tabs[tab]();

            } catch (e) {

                $("#app").innerHTML = box(
                    "Error",
                    `<span class="er">${esc(e.message)}</span>`
                );

            }
        }


        // ========================================
        // NAVIGATION CLICK
        // ========================================

        $("#nav").onclick = e => {

            const t = e.target.dataset.t;

            if (t && hasAccess(t)) {
                show(t);
            }

        };


        // ========================================
        // ROLE SWITCHING
        // ========================================

        $("#role").onchange = e => {

            role = e.target.value;

            // Start from Dashboard after switching role
            tab = "Dashboard";

            show();

        };


        // ========================================
        // INITIALIZE APPLICATION
        // ========================================

        show("Dashboard");

    </script>

</body>

</html>
